name: Verify Civora
on:
  pull_request:
  push:
    branches: [master, feat/civora-production-completion]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test assembleDebug lintDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
      # Upload unsigned artifacts only after every required check passes.
      - uses: actions/upload-artifact@v4
        with:
          name: civora-unsigned-release
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/bundle/release/
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix functions ci
      - run: npm --prefix functions audit --omit=dev --audit-level=high
      - run: npx -y firebase-tools@latest emulators:exec --project demo-civora --only auth,firestore,functions,storage "npm --prefix functions test"
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: '60'
          CIVORA_REQUIRE_EMULATORS: 'true'
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pcivora.emulatorHost=10.0.2.2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
